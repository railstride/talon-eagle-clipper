<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Talon – Eagle Clipper</title>
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body theme="dark">
    <main>
      <h1>Talon – Eagle Clipper</h1>
      <p class="intro">
        Imports what you share to Talon on your iPhone. Choose the same folder
        you picked there.
      </p>
      <dl>
        <dt>Folder</dt>
        <dd id="inbox">Not chosen</dd>
        <dt>Imported</dt>
        <dd id="imported">0</dd>
        <dt>Status</dt>
        <dd id="status" role="status">Waiting for a folder</dd>
      </dl>
    </main>
    <footer>
      <button id="choose" class="button" type="button">Choose Folder…</button>
    </footer>
    <script src="js/plugin.js"></script>
  </body>
</html>
